<header><span class="ttl">İlaç Sipariş Takip <span class="x" style="font-weight:400;font-size:13px;opacity:.85">— sipariş / bütçe / fiili karşılaştırma</span></span><span id="sv" class="sv noprint"></span><button class="hbtn" onclick="refresh()">⟳ Kaydet ve Yenile</button></header>
<nav id="tabs"></nav><nav class="cust" id="custs"></nav><main id="app"></main>
<script>
if(window.desktop){const _a=window.alert.bind(window),_c=window.confirm.bind(window);
  window.alert=m=>{_a(m);desktop.refocus()};window.confirm=m=>{const r=_c(m);desktop.refocus();return r}}
function askText(msg,def){return new Promise(res=>{const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:9999';
  o.innerHTML=`<div style="background:#fff;border-radius:8px;padding:16px;width:min(460px,92vw);box-shadow:0 8px 30px rgba(0,0,0,.3)"><div style="margin-bottom:10px;white-space:pre-wrap">${esc(msg)}</div><input type="text" style="width:100%;padding:7px" value="${esc(def||'')}"><div style="margin-top:12px;text-align:right"><button class="x-iptal">İptal</button> <button class="pr x-tamam">Tamam</button></div></div>`;
  document.body.appendChild(o);const inp=o.querySelector('input');const done=v=>{o.remove();res(v)};
  o.querySelector('.x-tamam').onclick=()=>done(inp.value);o.querySelector('.x-iptal').onclick=()=>done(null);
  inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value);else if(e.key==='Escape')done(null)};
  setTimeout(()=>{inp.focus();inp.select()},0)})}
const N=15,$=s=>document.querySelector(s);
const z=()=>Array(N).fill(0),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={customers:[],orders:{},budget:{},actual:{},months:[]};
const DESK=!!window.desktop;
try{const x=DESK?window.desktop.initial:localStorage.getItem('ilacdb');if(x)S=JSON.parse(x)}catch(e){}
fixS();
let FH=null,FS='Bağlı değil',NEEDP=false,tm;
const FSOK=!!(window.showSaveFilePicker&&window.showOpenFilePicker);
let dirty=false;
const fdt=iso=>{const d=new Date(iso);return isNaN(d)?'—':d.toLocaleString('tr-TR')};
function paintSv(st){const e=document.querySelector('#sv');let h='';
  if(st&&st.err)h+=`<span class="bad">⚠ ${esc(st.err)}</span>`;
  h+=`💾 Son kayıt: <b>${st&&st.lastSavedAt?fdt(st.lastSavedAt):'—'}</b>`;
  const sh=st&&st.shared;
  if(sh&&sh.enabled){const b=f=>`<button class="hbtn" onclick="desktop.syncShared()">${f}</button>`;
    h+=' · '+({ok:`🌐 Ortak alan: <b>güncel</b>${sh.at?' ('+fdt(sh.at)+')':''}`,
      offline:'⚠ Ortak alana ulaşılamıyor — yerelde kayıtlı, bağlantı gelince gönderilecek',
      conflict:'⚠ Ortak alanda çakışma '+b('Çöz'),
      newer:'🔄 Ortak alanda yeni sürüm var '+b('Güncelle')}[sh.state]||'🌐 Ortak alan')}
  if(e)e.innerHTML=h;const d=document.querySelector('#svd');if(d)d.innerHTML=h}
async function flushNow(force){clearTimeout(tm);if(!DESK||(!dirty&&!force))return;dirty=false;
  try{paintSv(await desktop.save(JSON.stringify(S)))}catch(e){dirty=true;paintSv({err:'Kayıt hatası: '+(e.message||e)})}}
const save=()=>{dirty=true;clearTimeout(tm);
  if(DESK){tm=setTimeout(flushNow,400)}
  else{try{localStorage.setItem('ilacdb',JSON.stringify(S));localStorage.setItem('ilacdb_ts',new Date().toISOString())}catch(e){}tm=setTimeout(writeF,400);paintSv({lastSavedAt:new Date().toISOString()})}};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('ilacfs',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function hPut(h){try{const d=await idb();d.transaction('h','readwrite').objectStore('h').put(h,'fh')}catch(e){}}
async function hGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('h').objectStore('h').get('fh');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
function updStatus(){const e=document.querySelector('#fs');if(e)e.textContent=FS}
async function writeF(){if(!FH)return;try{
  if(await FH.queryPermission({mode:'readwrite'})!=='granted'){NEEDP=true;FS='İzin gerekli — yeniden bağlanın';render();return}
  const w=await FH.createWritable();await w.write(JSON.stringify(S));await w.close();
  FS='Kaydedildi: '+FH.name+' ('+new Date().toLocaleTimeString('tr-TR')+')'}catch(e){FS='Yazma hatası: '+e.message}updStatus()}
async function readF(){try{const t=await (await FH.getFile()).text();if(!t.trim())return false;const d=JSON.parse(t);if(!d.customers)return false;
  S=d;fixS();try{localStorage.setItem('ilacdb',JSON.stringify(S))}catch(e){}cur=S.customers[0]?S.customers[0].id:null;return true}catch(e){return false}}
const JT=[{description:'JSON veri dosyası',accept:{'application/json':['.json']}}];
async function newFile(){if(!FSOK)return alert('Bu özellik Chrome veya Edge tarayıcısı gerektirir.');
  try{FH=await showSaveFilePicker({suggestedName:'siparis_verileri.json',types:JT});await hPut(FH);NEEDP=false;await writeF();render()}catch(e){}}
async function openFile(){if(!FSOK)return alert('Bu özellik Chrome veya Edge tarayıcısı gerektirir.');
  try{const [h]=await showOpenFilePicker({types:JT});FH=h;await FH.requestPermission({mode:'readwrite'});await hPut(h);NEEDP=false;
    if(await readF()){FS='Dosyadan yüklendi: '+h.name;alert('Veriler dosyadan yüklendi.')}else{await writeF()}render()}catch(e){}}
async function reconnect(){try{if(await FH.requestPermission({mode:'readwrite'})==='granted'){NEEDP=false;
  FS=(await readF())?'Dosyadan yüklendi: '+FH.name:'Bağlandı: '+FH.name;render()}}catch(e){}}
const bn=()=>NEEDP&&FH?`<div class="card noprint" style="background:#fff7e0">Veri dosyası (<b>${esc(FH.name)}</b>) bağlı ama tarayıcı izin istiyor. <button class="pr" onclick="reconnect()">Yeniden bağlan ve dosyadan yükle</button></div>`:'';
const TR=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const M=()=>{const s=S.start;return Array.from({length:N},(_,i)=>{if(!s)return 'Ay'+(i+1);const d=s.m+i;return TR[d%12]+' '+(s.y+Math.floor(d/12))})};
let T='genel',cur=null;
const fmt=n=>(n||0).toLocaleString('tr-TR',{maximumFractionDigits:0});
const pct=(a,b)=>b?(a-b)/b*100:null;
const pc=(a,b)=>{const p=pct(a,b);return p===null?'<td>-</td>':`<td class="${p>0?'pos':p<0?'neg':''}">%${p.toLocaleString('tr-TR',{maximumFractionDigits:1})}</td>`};
const sum=a=>a.reduce((s,v)=>s+(v||0),0);
const cname=id=>(S.customers.find(c=>c.id===id)||{}).name||'?';
const head=(first)=>`<tr>${first}${M().map(m=>`<th>${esc(m)}</th>`).join('')}<th>${N} Ay Toplam</th></tr>`;
const cells=a=>a.map(v=>`<td>${fmt(v)}</td>`).join('')+`<td><b>${fmt(sum(a))}</b></td>`;

function fixS(){S.products=S.products||{};S.series=S.series||{};S.actual=S.actual||{};S.orders=S.orders||{};S.budget=S.budget||{};S.prev=S.prev||{};S.manualMark=S.manualMark||{};S.revize=S.revize||{};S.ord12=S.ord12||{};S.ordB=S.ordB||{};if(!Object.keys(S.ordB).length&&Object.keys(S.ord12).length)S.ordB=JSON.parse(JSON.stringify(S.ord12))}
const nc=x=>String(x==null?'':x).trim().replace(/\.0+$/,'');
const P=c=>(S.products&&S.products[c])||[];
const fq=n=>(n||0).toLocaleString('tr-TR',{maximumFractionDigits:2});
const fmt2=n=>(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const tgrp=d=>String(parseInt(d||'0',10)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
// Yazarken: virgül yazıldıysa ondalık olarak alınır; virgül yoksa rakamlar sağdan kuruş olarak okunur (1234567 → 12.345,67)
function tlPart(raw){raw=String(raw);
  if(raw.includes(',')){const k=raw.indexOf(',');const ip=raw.slice(0,k).replace(/\D/g,''),fp=raw.slice(k+1).replace(/\D/g,'').slice(0,2);
    return (ip?tgrp(ip):'')+','+fp}
  const d=raw.replace(/\D/g,'');if(!d)return '';
  return tgrp(d.slice(0,-2)||'0')+','+d.slice(-2).padStart(2,'0')}
function qVal(raw){raw=String(raw==null?'':raw).trim();if(!raw)return '';
  if(raw.includes(',')){const k=raw.indexOf(',');const ip=raw.slice(0,k).replace(/\D/g,'')||'0',fp=raw.slice(k+1).replace(/\D/g,'');return parseFloat(ip+'.'+(fp||'0'))}
  const d=raw.replace(/\D/g,'');return d?parseInt(d,10):''}
function tlIn(el){const v=tlPart(el.value);if(v!==el.value)el.value=v}
function tlVal(raw){raw=String(raw==null?'':raw).trim();if(!raw)return '';
  if(raw.includes(',')){const k=raw.indexOf(',');const ip=raw.slice(0,k).replace(/\D/g,'')||'0',fp=raw.slice(k+1).replace(/\D/g,'').slice(0,2);
    return parseFloat(ip+'.'+(fp||'0'))}
  const d=raw.replace(/\D/g,'');if(!d)return '';return parseInt(d,10)/100}
let SB=[],SM=-1,RM=-1,RC='all',UF='all',LC='',GA=-1;
function valArr(it){if(it.v){const a=z();if(S.start)for(let i=0;i<N;i++)a[i]=it.v[mkey(S.start.y,S.start.m,i)]||0;return a}return it.m||z()}
function migrateOrders(){if(!S.start)return;Object.keys(S.orders||{}).forEach(c=>{S.orders[c]=(S.orders[c]||[]).map(it=>{
  if(it.v)return it;const v={};(it.m||[]).forEach((x,i)=>{if(x)v[mkey(S.start.y,S.start.m,i)]=x});return{name:it.name,code:it.code,v}})})}
function agg(items){const m={};(items||[]).forEach(it=>{const k=nc(it.code)||it.name;const e=m[k]=m[k]||{name:it.name,code:it.code,v:{}};
  Object.keys(it.v||{}).forEach(mk=>{e.v[mk]=(e.v[mk]||0)+(+it.v[mk]||0)})});return m}
function mkLabel(mk){const [y,mo]=mk.split('-').map(Number);return TR[mo]+' '+y}
let DARC='prev';
function baseFor(cid){if(DARC!=='prev'){const a=(S.arsiv||[]).find(x=>x.id===DARC);return a&&a.data[cid]?{items:a.data[cid],ts:a.ts}:null}
  const p=(S.prev||{})[cid];return p?{items:p.items,ts:p.ts}:null}
function arcLabel(a){const ks=(a.keys||[]).map(k=>{const [y,m]=k.split('-').map(Number);return y*12+m});
  if(!ks.length)return '-';const lo=Math.min(...ks),hi=Math.max(...ks);
  return TR[lo%12]+' '+Math.floor(lo/12)+' – '+TR[hi%12]+' '+Math.floor(hi/12)}
function diffRows(c){const prev=baseFor(c.id);if(!prev)return[];
  const pm=agg(prev.items),cm=agg(S.orders[c.id]||[]),keys=new Set([...Object.keys(pm),...Object.keys(cm)]),out=[];
  keys.forEach(k=>{const a=pm[k],b=cm[k],mks=new Set([...Object.keys(a?a.v:{}),...Object.keys(b?b.v:{})]);
    mks.forEach(mk=>{const o=a?(a.v[mk]||0):0,n=b?(b.v[mk]||0):0;if(o===n)return;
      const t=(!a?'Yeni ürün':!b?'Kaldırıldı':o===0?'Yeni sipariş':n===0?'Sipariş iptal':'Miktar değişti')+((S.manualMark||{})[c.id+'|'+k+'|'+mk]?' (manuel)':'');
      const ref=b||a;out.push({cust:c.name,mk,ay:mkLabel(mk),name:ref.name,code:ref.code,o,n,d:n-o,p:o?(n-o)/o*100:null,t})})});
  return out}
function diffAll(cs){const all=[];cs.forEach(c=>diffRows(c).forEach(x=>all.push(x)));
  return all.sort((x,y)=>{const a=x.mk.split('-').map(Number),b=y.mk.split('-').map(Number);return (a[0]*12+a[1])-(b[0]*12+b[1])||x.cust.localeCompare(y.cust,'tr')||String(x.code).localeCompare(String(y.code))})}
let MC='';
function vManuel(){
  if(!S.customers.length)return '<div class="card">Önce müşteri tanımlayın.</div>';
  if(!S.start)return '<div class="card">Önce bir sipariş Excel dosyası yükleyin; 15 aylık dönem oradan belirlenir.</div>';
  if(!MC||!S.customers.some(c=>c.id===MC))MC=S.customers[0].id;
  const c=MC,items=S.orders[c]||[],codes=[],names={};
  S.pnotes=S.pnotes||{};S.mnotes=S.mnotes||{};
  P(c).forEach(p=>{const k=nc(p.code);if(!codes.includes(k))codes.push(k);names[k]=p.name});
  items.forEach(it=>{const k=nc(it.code);if(!codes.includes(k))codes.push(k);names[k]=names[k]||it.name});
  let r=`<div class="card"><div class="row noprint"><label>Müşteri: <select onchange="MC=this.value;render()">${S.customers.map(x=>`<option value="${x.id}" ${x.id===c?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
  <span class="hint">Hücrelere tıklayıp değeri değiştirin; alandan çıkınca kaydedilir. Açıklama alanına ürün notu yazın (alandan çıkınca kaydedilir, silmek için alanı boşaltın). Hücredeki ✎ düğmesiyle ay notu ekleyin, düzenleyin veya silin.</span></div>
  <div class="row noprint"><input type="text" id="nk" placeholder="Malzeme kodu" style="width:150px"><input type="text" id="nn" placeholder="Ürün adı" style="width:260px"><button class="pr" onclick="addOrdRow()">Yeni ürün satırı ekle</button></div>
  <h3>${esc(c?cname(c):'')} — 15 aylık siparişler (manuel düzenleme)</h3>
  <table><tr><th class="l">Malzeme Kodu</th><th class="l">Ürün</th><th class="l">Açıklama</th>${M().map(m=>`<th>${esc(m)}</th>`).join('')}<th>${N} Ay Toplam</th></tr>`;
  const colT=z();
  codes.forEach(k=>{const it=items.find(x=>nc(x.code)===k),vals=valArr(it||{v:{}}),pn=S.pnotes[c+'|'+k]||'';
    colT.forEach((_,i)=>colT[i]+=vals[i]||0);
    r+=`<tr><td class="l">${esc(k)}</td><td class="l">${esc(names[k]||'')}</td>`+
      `<td class="l"><input type="text" style="width:240px" value="${esc(pn)}" data-c="${esc(c)}" data-k="${esc(k)}" placeholder="Ürün notu" onchange="setPNoteEl(this)"></td>`+
      vals.map((v,i)=>{const mn=S.mnotes[c+'|'+k+'|'+mkey(S.start.y,S.start.m,i)]||'';
        return `<td style="white-space:nowrap"><input type="text" inputmode="decimal" autocomplete="off" style="width:90px;text-align:right" value="${v?fq(v):''}" data-c="${esc(c)}" data-k="${esc(k)}" data-i="${i}" onchange="setOrdEl(this)"><button class="mnb" title="${esc(mn)}" data-c="${esc(c)}" data-k="${esc(k)}" data-i="${i}" onclick="editMNoteEl(this)" style="padding:2px 5px;margin-left:2px;${mn?'color:#b3261e;font-weight:700':''}">${mn?'●':'✎'}</button></td>`}).join('')+
      `<td><b>${fq(sum(vals))}</b></td></tr>`});
  if(!codes.length)r+=`<tr><td class="l" colspan="${N+4}">Bu müşteri için sipariş yok.</td></tr>`;
  else r+=`<tr class="t"><td class="l" colspan="3">TOPLAM</td>${colT.map(v=>`<td>${fq(v)}</td>`).join('')}<td>${fq(sum(colT))}</td></tr>`;
  return r+'</table></div>'}
function setPNoteEl(el){const key=el.dataset.c+'|'+el.dataset.k,v=el.value.trim();
  S.pnotes=S.pnotes||{};if(v)S.pnotes[key]=v;else delete S.pnotes[key];save()}
async function editMNoteEl(el){const c=el.dataset.c,k=el.dataset.k,key=c+'|'+k+'|'+mkey(S.start.y,S.start.m,+el.dataset.i);
  S.mnotes=S.mnotes||{};const cur=S.mnotes[key]||'';
  const v=await askText('Ay notu ('+M()[+el.dataset.i]+').\nSilmek için alanı boş bırakıp Tamam\'a basın:',cur);
  if(v===null)return;const t=v.trim();
  if(t)S.mnotes[key]=t;else delete S.mnotes[key];
  save();render()}
function setOrdEl(el){setOrd(el.dataset.c,el.dataset.k,+el.dataset.i,el.value)}
function setOrd(c,k,i,raw){
  const val=qVal(raw),num=val===''?0:val;
  const key=mkey(S.start.y,S.start.m,i);
  let it=(S.orders[c]||[]).find(x=>nc(x.code)===k);
  const old=it?(it.v&&it.v[key]||0):0;
  if(old===num){render();return}
  S.prev=S.prev||{};
  if(!S.prev[c])S.prev[c]={ts:new Date().toISOString(),items:JSON.parse(JSON.stringify(S.orders[c]||[]))};
  S.orders[c]=S.orders[c]||[];

function upload(){
  const f=$('#ufile').files[0];if(!f)return alert('Dosya seçin');
  const type=$('#utype').value,bud=type==='budget'||type==='revize',tgt=type==='revize'?'revize':'budget',NM=bud?12:N;
  const rd=new FileReader();rd.onload=e=>{try{
    migrateBudget();migrateOrders();
    const wb=XLSX.read(e.target.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    const L=x=>String(x).trim().toLocaleLowerCase('tr'),MN=['oca','şub','mar','nis','may','haz','tem','ağu','eyl','eki','kas','ara'];
    const hd=x=>{if(x instanceof Date)return{y:x.getFullYear(),m:x.getMonth()};
      if(typeof x==='number'){if(x>30000&&x<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(x)*864e5);return{y:d.getUTCFullYear(),m:d.getUTCMonth()}}return null}
      const t=L(x);let a=t.match(/^(\d{4})[-\/.](\d{1,2})/);if(a&&+a[2]>=1&&+a[2]<=12)return{y:+a[1],m:+a[2]-1};
      a=t.match(/^(\d{1,2})[-\/.](\d{4})$/);if(a&&+a[1]>=1&&+a[1]<=12)return{y:+a[2],m:+a[1]-1};
      a=t.match(/^([a-zçğıöşü]{3})[a-zçğıöşü]*\.?[\s-]+(\d{4})$/);if(a&&MN.includes(a[1]))return{y:+a[2],m:MN.indexOf(a[1])};return null};
    let hi=rows.findIndex((r,i)=>i<15&&r.filter(x=>String(x).trim()!=='').length>=3);if(hi<0)hi=0;
    const hr=rows[hi],h=hr.map(x=>String(x).trim()),hds=hr.map(hd),fm=hds.findIndex(d=>d);
    let ci=-1,ki=-1,ni=-1,mi=[],kd=null;
    if(fm>=0){
      const ids=h.map((x,i)=>i).filter(i=>i<fm&&h[i]!=='');
      ci=ids.find(i=>/müşteri|musteri|firma|cari/.test(L(h[i])))??-1;
      const rest=ids.filter(i=>i!==ci);
      ni=rest.find(i=>/ism|isim|ad[ıi]|tanım|açıklama|ilaç|ilac/.test(L(h[i])))??rest[0]??-1;
      ki=rest.find(i=>i!==ni&&/kod|code|malzeme|sku|stok/.test(L(h[i])))??rest.find(i=>i!==ni)??-1;
      if(rest.length===1){const c0=rest[0],vs=rows.slice(hi+1,hi+25).map(r=>String(r[c0]).trim()).filter(Boolean);if((vs.length&&vs.every(v=>/^\d+$/.test(v)))||/kod|code/.test(L(h[c0]))){ki=c0;ni=-1}else{ni=c0;ki=-1}}
      mi=hds.map((d,i)=>i).filter(i=>i>=fm&&hds[i]).slice(0,NM);kd=mi.map(i=>hds[i]);
    }else{
      ci=h.findIndex(x=>/müşteri|musteri/.test(L(x)));ki=h.findIndex(x=>/kod|code/.test(L(x)));
      ni=h.findIndex((x,i)=>i!==ki&&i!==ci&&/ilaç|ilac|ad[ıi]|isim|ism|ürün|urun/.test(L(x)));
      if(ni<0)ni=h.findIndex((x,i)=>i!==ki&&i!==ci);
      mi=h.map((x,i)=>i).filter(i=>![ci,ki,ni].includes(i)&&h[i]!==''&&!/toplam|total|birim|genel/.test(L(h[i]))).slice(0,NM);
    }
    if((ni<0&&ki<0)||!mi.length)return alert('Sütunlar anlaşılamadı. Beklenen: [Müşteri], İlaç/Ürün adı, Malzeme/Ürün kodu ve ay sütunları (başlıkta tarih veya ay adı).');
    if(bud&&ki<0)return alert('Bütçe dosyasında Malzeme Kodu sütunu bulunamadı.');
    const pick=bud?{y:+$('#sy').value,m:0}:(kd?{y:kd[0].y,m:kd[0].m}:{m:+$('#sm').value,y:+$('#sy').value});
    // Bütçe verisi her zaman seçilen yılın Ocak-Aralık aylarına yazılır; sipariş döneminden bağımsızdır.
    if(bud&&mi.length<12)return alert('Bütçe dosyasında Ocak-Aralık için 12 aylık sütun bulunamadı.');
    if(bud&&kd){
      const selectedYear=pick.y;
      const dated=mi.filter(j=>hds[j]&&hds[j].y===selectedYear).sort((a,b)=>hds[a].m-hds[b].m);
      if(dated.length===12)mi=dated;
      else if(dated.length>0&&dated.length!==12)return alert('Seçilen '+selectedYear+' yılı için Excel’de 12 ayın tamamı bulunamadı. Ocak-Aralık sütunlarını kontrol edin.');
    }
    const colKeys=bud?Array.from({length:12},(_,i)=>mkey(pick.y,i,0)):(kd?kd.map(d=>d.y+'-'+d.m):mi.map((j,i)=>mkey(pick.y,pick.m,i)));
    const norm=x=>String(x).trim().toLocaleLowerCase('tr').replace(/\s+/g,' ');
    const num=v=>{if(typeof v==='number')return v;let t=String(v).trim().replace(/\s/g,'');if(!t)return 0;
      if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');return parseFloat(t)||0};
    const by={},names=new Set();let other=0;
    const cell=(r,i)=>i>=0?String(r[i]).trim():'';
    const unmatched=[],multi=new Set();
    rows.slice(hi+1).forEach(r=>{if(!cell(r,ni)&&!cell(r,ki))return;
      const code=nc(cell(r,ki)),name=cell(r,ni)||code,v={};mi.forEach((j,i)=>{v[colKeys[i]]=num(r[j])});
      if(bud){
        const targets=S.customers.filter(c=>P(c.id).some(p=>nc(p.code)===code));
        if(!targets.length){unmatched.push(code||name);return}
        if(targets.length>1)multi.add(code);
        targets.forEach(c=>{const p=P(c.id).find(p=>nc(p.code)===code);(by[c.id]=by[c.id]||[]).push({code,name:(p&&p.name)||name,v:{...v}})});
        return}
      // Sipariş satırlarını müşteri seçimine göre değil, malzeme kodunun ürün tanımlarındaki eşleşmesine göre yönlendir.
      // Excel'de müşteri adı varsa ve bu müşteri sistemde tanımlıysa önce müşteri + malzeme kodu eşleşmesi kullanılır.
      if(!code){unmatched.push(name);return}
      const matchingCustomers=S.customers.filter(c=>P(c.id).some(p=>nc(p.code)===code));
      let targets=matchingCustomers;
      if(ci>=0){
        const n=String(r[ci]).trim();if(n)names.add(n);
        const named=S.customers.find(c=>n&&norm(c.name)===norm(n));
        if(named&&P(named.id).some(p=>nc(p.code)===code))targets=[named];
        else if(named&&matchingCustomers.length)targets=matchingCustomers;
      }
      if(!targets.length){unmatched.push(code||name);return}
      if(targets.length>1)multi.add(code);
      targets.forEach(c=>{(by[c.id]=by[c.id]||[]).push({code,name,v:{...v}})});
    });
    if(bud&&!Object.keys(by).length)return alert('Dosyadaki malzeme kodlarından hiçbiri müşteri ürün tanımlarında bulunamadı. Önce "Ürün / Parti Tanımı" sekmesinde ürünleri tanımlayın.\nKodlar: '+[...new Set(unmatched)].slice(0,10).join(', '));
    if(!Object.keys(by).length)return alert('Yüklenecek eşleşen satır bulunamadı. Malzeme kodlarının Ürün / Parti Tanımı sekmesinde tanımlı olduğunu kontrol edin.\nEşleşmeyen kod örnekleri: '+[...new Set(unmatched)].slice(0,10).join(', '));
    let skipped=[];
    if(!bud)Object.keys(by).forEach(c=>{const mp=P(c);if(!mp.length)return;const acc={};
      by[c].forEach(it=>{const k=nc(it.code),p=mp.find(p=>nc(p.code)===k);if(!p){skipped.push(it.code||it.name);return}
        const a=acc[k]=acc[k]||{};Object.keys(it.v).forEach(ck=>{a[ck]=(a[ck]||0)+(it.v[ck]||0)})});
      by[c]=mp.map(p=>({name:p.name,code:nc(p.code),v:acc[nc(p.code)]||{}}))});
    const keys=new Set(colKeys);
    if(bud&&!confirm('Mevcut tüm '+(tgt==='revize'?'revize bütçe':'bütçe')+' verileri silinip bu dosyadaki ile değiştirilecek. Devam edilsin mi?'))return;
    if(bud)S[tgt]={};
    // Bütçe / revize bütçe dosyası yüklendiğinde de gösterim dönemini dosyanın ilk ayına göre güncelle.
    // Böylece bütçe verisi mevcut S.start (ör. Ekim) yüzünden yanlış dönemin dışında kalmaz.
    if(!S.start)S.start=pick;
    if(bud)compareYear=pick.y;
    migrateBudget();
    if(!bud){const ad={};let any=false;
      Object.keys(by).forEach(c=>{if((S.orders[c]||[]).length){ad[c]=JSON.parse(JSON.stringify(S.orders[c]));any=true}});
      if(any){S.arsiv=S.arsiv||[];S.arsiv.push({id:'a'+Date.now(),ts:new Date().toISOString(),data:ad,
        keys:[...new Set(Object.values(ad).flat().flatMap(it=>Object.keys(it.v||{})))]})}}
    if(!bud){S.prev={};DARC='prev';}
    Object.keys(by).forEach(c=>{
      if(!bud){Object.keys(S.manualMark||{}).forEach(x=>{if(x.startsWith(c+'|'))delete S.manualMark[x]});S.prev=S.prev||{};S.prev[c]={ts:new Date().toISOString(),items:JSON.parse(JSON.stringify(S.orders[c]||[]))};
        S.orders[c]=by[c].filter(it=>Object.keys(it.v||{}).length);
        const cutB=cutIdx();S.ordB=S.ordB||{};const curB=S.ordB[c]||[];
        by[c].forEach(n=>{let ex=curB.find(o=>nc(o.code)===nc(n.code));if(!ex){ex={code:n.code,name:n.name,v:{}};curB.push(ex)}
          colKeys.forEach(k=>{const [y,m]=k.split('-').map(Number);if(y*12+m>=cutB||!(k in ex.v))ex.v[k]=+((n.v||{})[k])||0})});
        S.ordB[c]=curB.filter(it=>Object.keys(it.v).length);return}
      const old=[];
      by[c].forEach(n=>{const k=n.code||n.name,ex=old.find(o=>(o.code||o.name)===k);if(ex)Object.assign(ex.v,n.v);else old.push(n)});
      S[tgt][c]=old.filter(it=>Object.keys(it.v).length)});
    save();
    let msg=Object.keys(by).length+' müşteri için '+Object.values(by).reduce((s,a)=>s+a.length,0)+' satır yüklendi.';
    if(!bud){msg+='\nÖnceki sipariş verisi arşivlendi (Arşiv sekmesi).';
      if(unmatched.length)msg+='\nÜrün tanımlarında eşleşmeyen '+new Set(unmatched).size+' satır/kod atlandı: '+[...new Set(unmatched)].slice(0,8).join(', ');
      if(multi.size)msg+='\nBirden fazla müşteride tanımlı '+multi.size+' malzeme kodu, eşleşen müşterilere dağıtıldı.';}
    if(bud){const cn=Object.keys(by).map(c=>cname(c)+': '+by[c].length+' ürün').join('\n');msg+='\n'+cn;
      if(unmatched.length)msg+='\nÜrün tanımında olmayan '+unmatched.length+' satır atlandı: '+[...new Set(unmatched)].slice(0,8).join(', ');
      if(multi.size)msg+='\nBirden fazla müşteride tanımlı '+multi.size+' kod, tüm ilgili müşterilere yazıldı.';}
    if(kd)msg+='\nAy bilgisi dosyadaki başlık tarihlerinden algılandı: '+TR[kd[0].m]+' '+kd[0].y+' – '+TR[kd[kd.length-1].m]+' '+kd[kd.length-1].y+'.';
    if(skipped.length){const u=[...new Set(skipped)];msg+='\nÜrün tanımında olmayan '+u.length+' malzeme kodu atlandı: '+u.slice(0,8).join(', ')+(u.length>8?' …':'')}
    if(other)msg+='\n'+other+' satır başka müşterilere ait olduğu için atlandı.';
    if(bud){const win=new Set(Array.from({length:12},(_,i)=>mkey(pick.y,i,0)));const inn=[...keys].filter(k=>win.has(k)).length;
      msg+='\n'+(tgt==='revize'?'Revize bütçe ':'Bütçe ')+inn+'/12 ay, '+pick.y+' yılı Ocak-Aralık dönemine kaydedildi.';
      if(inn!==12)msg+='\nUyarı: 12 aylık dönem tam eşleşmedi; Excel sütunlarını kontrol edin.'}
    alert(msg);
    render();
  }catch(err){alert('Dosya okunamadı: '+err.message)}};
  rd.readAsArrayBuffer(f);}

    r+=`<div class="card"><h3>${esc(cname(DS))} — ilaç bazında sil (${TL[DT]})</h3><table style="width:auto"><tr><th class="l">İlaç</th><th class="l">Kod</th><th>Sipariş</th><th>Bütçe</th><th>Fiili</th><th></th></tr>`;
    l.forEach((e,i)=>{r+=`<tr><td class="l">${esc(e.name)}</td><td class="l">${esc(e.code)}</td><td>${fmt(sum(e.o))}</td><td>${fmt(sum(e.b))}</td><td>${fmt(sum(e.a))}</td><td><button class="dn" onclick="delItem(${i})">Sil</button></td></tr>`});
    r+='</table></div>';}

function wipe(){
  const lab=DS==='all'?'TÜM müşterilerin':cname(DS)+' müşterisinin';
  if(!confirm(lab+' '+TL[DT]+' verileri silinsin mi? Bu işlem geri alınamaz.'))return;

  cs.forEach(c=>(DT==='all'?['orders','ordB','ord12','budget','revize','actual']:(DT==='orders'?['orders','ordB','ord12']:[DT])).forEach(t=>{if(S[t])delete S[t][c]}));if(DT==='actual'||DT==='all')cs.forEach(c=>delete S.series[c]);save();render();}
function delItem(i){

  const ts=DT==='all'?['orders','ordB','budget','revize','actual']:(DT==='orders'?['orders','ordB']:[DT]);
  ts.forEach(t=>{if(t==='actual'){if(S.actual[DS])delete S.actual[DS][e.k];if(S.series[DS])delete S.series[DS][e.k]}else S[t][DS]=(S[t][DS]||[]).filter(it=>(it.code||it.name)!==e.k)});
  save();render();}

function fdate(d){if(!d)return '';const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d);return m?m[3]+'.'+m[2]+'.'+m[1]:esc(d)}
function selMK(){const gi=(GA<0||GA>=N)?0:GA;return S.start?mkey(S.start.y,S.start.m,gi):null}
function selLabel(){return M()[(GA<0||GA>=N)?0:GA]}
function serDetail(c){const out=[],sr=(S.series||{})[c]||{};
  Object.keys(sr).forEach(k=>{const p=P(c).find(p=>nc(p.code)===k),name=p?p.name:k,code=p?nc(p.code):k;
    Object.keys(sr[k]).forEach(mk=>{const [y,mo]=mk.split('-').map(Number),arr=sr[k][mk]||[];
      arr.forEach((x,j)=>{if(x.q===''&&x.t===''&&!x.p&&!x.d&&!(x.n&&String(x.n).trim()))return;
        out.push({mk:mk,ord:y*12+mo,ay:TR[mo]+' '+y,name,code,seri:j+1,q:+x.q||0,t:+x.t||0,p:x.p||'',d:x.d||'',n:x.n||''})})})});
  return out.sort((a,b)=>a.ord-b.ord||a.code.localeCompare(b.code)||a.seri-b.seri)}
function vDetay(c){const mk=selMK(),l=serDetail(c).filter(x=>x.mk===mk);if(!l.length)return `<div class="card"><h3>${esc(cname(c))} — ${esc(selLabel())} parti / fiili giriş detayı</h3><p class="hint">Bu ay için giriş yok.</p></div>`;
  let r=`<div class="card"><h3>${esc(cname(c))} — ${esc(selLabel())} parti / fiili giriş detayı</h3><table><tr><th class="l">Ay</th><th class="l">Ürün</th><th class="l">Malzeme Kodu</th><th>Seri</th><th>Fiili Miktar</th><th>Tutar TL</th><th class="l">Parti No</th><th class="l">Teslimat Tarihi</th><th class="l">Açıklama</th></tr>`;
  let tq=0,tt=0;l.forEach(x=>{tq+=x.q;tt+=x.t;r+=`<tr><td class="l">${esc(x.ay)}</td><td class="l">${esc(x.name)}</td><td class="l">${esc(x.code)}</td><td>${x.seri}</td><td>${fq(x.q)}</td><td>${fmt2(x.t)}</td><td class="l">${esc(x.p)}</td><td class="l">${fdate(x.d)}</td><td class="l" style="white-space:normal">${esc(x.n)}</td></tr>`});
  r+=`<tr class="t"><td class="l" colspan="4">TOPLAM</td><td>${fq(tq)}</td><td>${fmt2(tt)}</td><td colspan="3"></td></tr>`;
  return r+'</table></div>'}
function printRep(kind){
  const sv=[T,cur],pb='<div style="page-break-before:always"></div>';
  const yr=compareYear||(S.start?S.start.y:new Date().getFullYear());
  const per=id=>{cur=id;return vMusteri(true)+cmp(annualCompare(entries(id),yr),yr)+vDetay(id)};
  let h=kind==='genel'?vGenel():kind==='hepsi'?vGenel()+S.customers.map(c=>pb+per(c.id)).join(''):per(kind);
  $('#app').innerHTML=`<h2>Sipariş Raporu — ${new Date().toLocaleDateString('tr-TR')}</h2>`+h;
  window.onafterprint=()=>{[T,cur]=sv;render();window.onafterprint=null};
  setTimeout(()=>print(),100);}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function backup(){dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'siparis_yedek_'+new Date().toISOString().slice(0,10)+'.json')}
function restore(f){if(!f)return;const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.customers)throw 0;S=d;fixS();save();cur=null;alert('Yedek yüklendi');render()}catch(x){alert('Geçersiz yedek dosyası')}};r.readAsText(f)}
async function exportX(){
  if(!window.ExcelJS)return alert('Excel kütüphanesi yüklenemedi.');
  const wb=new ExcelJS.Workbook(),ms=M(),thin={style:'thin',color:{argb:'FFBFC9D4'}},bd={top:thin,left:thin,bottom:thin,right:thin};
  const fill=a=>({type:'pattern',pattern:'solid',fgColor:{argb:a}}),fk=(a,b)=>b?(a-b)/b*100:null;
  const title=(ws,r,t,sz)=>{const c=ws.getCell(r,1);c.value=t;c.font={bold:true,size:sz||12,color:{argb:'FF12355B'}}};
  function tbl(ws,r0,head,rows,o){
    const h=ws.getRow(r0);h.height=22;
    head.forEach((v,i)=>{const c=h.getCell(i+1);c.value=v;c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill=fill('FF12355B');c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=bd});
    rows.forEach((rw,ri)=>{const row=ws.getRow(r0+1+ri),tot=o.tot&&o.tot(ri);
      rw.forEach((v,i)=>{const c=row.getCell(i+1),isP=i>=o.txt&&o.pct&&o.pct(ri,i);
        c.value=(isP&&v===null)?'-':v;c.border=bd;c.font={bold:!!tot};
        if(i<o.txt)c.alignment={vertical:'middle',wrapText:true};
        else{c.alignment={horizontal:'right',vertical:'middle'};c.numFmt=isP?'0.0"%"':'#,##0';
          if(isP&&typeof v==='number')c.font={bold:!!tot,color:{argb:v>0?'FF1F7A4D':v<0?'FFB3261E':'FF000000'}}}
        c.fill=fill(tot?'FFDCE6F1':ri%2?'FFF4F7FA':'FFFFFFFF')})});
    return r0+rows.length+2}
  const period='Dönem: '+ms[0]+' – '+ms[N-1]+'   |   Rapor tarihi: '+new Date().toLocaleDateString('tr-TR');
  const sub=(ws)=>{const c=ws.getCell(2,1);c.value=period;c.font={italic:true,color:{argb:'FF5B6B7A'}}};
  const all=entries('all'),used=new Set(['genel özet','karşılaştırma']);

  // Genel Özet
  let ws=wb.addWorksheet('Genel Özet',{properties:{tabColor:{argb:'FF12355B'}}});
  title(ws,1,'İlaç Sipariş Raporu',16);sub(ws);
  const ta=col(all,'o'),tb=col(all,'b'),tc=col(all,'a');
  let r=4;title(ws,r,'Müşteri bazında aylık sipariş');
  const rA=S.customers.map(c=>{const x=col(entries(c.id),'o');return [c.name,...x,sum(x)]});rA.push(['TOPLAM',...ta,sum(ta)]);
  r=tbl(ws,r+1,['Müşteri',...ms,'Toplam'],rA,{txt:1,tot:i=>i===rA.length-1});
  title(ws,r,'Sipariş / Bütçe / Fiili özeti (tüm müşteriler)');
  const rB=[['Sipariş',...ta,sum(ta)],['Bütçe',...tb,sum(tb)],['Fark % (Sipariş/Bütçe)',...ta.map((v,i)=>fk(v,tb[i])),fk(sum(ta),sum(tb))],
    ['Fiili',...tc,sum(tc)],['Fark % (Fiili/Bütçe)',...tc.map((v,i)=>fk(v,tb[i])),fk(sum(tc),sum(tb))]];
  r=tbl(ws,r+1,['Özet ('+N+' ay)',...ms,'Toplam'],rB,{txt:1,pct:ri=>ri===2||ri===4});
  title(ws,r,N+' aylık müşteri karşılaştırması');
  const rC=S.customers.map(c=>{const l=entries(c.id),o=sum(col(l,'o')),b=sum(col(l,'b')),a=sum(col(l,'a'));return [c.name,o,b,fk(o,b),a,fk(a,b)]});
  tbl(ws,r+1,['Müşteri','Sipariş','Bütçe','Fark %','Fiili','Fiili/Bütçe %'],rC,{txt:1,pct:(ri,i)=>i===3||i===5});
  ws.getColumn(1).width=34;for(let i=2;i<=N+2;i++)ws.getColumn(i).width=12;ws.getColumn(N+2).width=15;

  // Karşılaştırma (ilaç bazında)
  ws=wb.addWorksheet('Karşılaştırma',{properties:{tabColor:{argb:'FF1F7A4D'}},views:[{state:'frozen',xSplit:4,ySplit:4}]});
  title(ws,1,'İlaç bazında Sipariş – Bütçe karşılaştırması',14);sub(ws);
  const rK=[];all.forEach(e=>{const t=[cname(e.cid),e.name,e.code];
    rK.push([...t,'Sipariş',...e.o,sum(e.o)],[...t,'Bütçe',...e.b,sum(e.b)],[...t,'Fark %',...e.o.map((v,i)=>fk(v,e.b[i])),fk(sum(e.o),sum(e.b))])});
  tbl(ws,4,['Müşteri','İlaç','Kod','Tür',...ms,'Toplam'],rK,{txt:4,pct:ri=>ri%3===2,tot:ri=>ri%3===2});
  all.forEach((e,k)=>{const r1=5+k*3;[1,2,3].forEach(c=>{ws.mergeCells(r1,c,r1+2,c);ws.getCell(r1,c).alignment={vertical:'middle',wrapText:true}})});
  [30,38,14,12].forEach((w,i)=>ws.getColumn(i+1).width=w);for(let i=5;i<=N+5;i++)ws.getColumn(i).width=11;ws.getColumn(N+5).width=14;

  // Müşteri sekmeleri: yalnızca sipariş
  S.customers.forEach(c=>{
    let nm=(c.name.replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,28)||'Müşteri'),base=nm,n=2;
    while(used.has(nm.toLowerCase()))nm=base+' '+n++;used.add(nm.toLowerCase());
    const w=wb.addWorksheet(nm,{properties:{tabColor:{argb:'FF2F6DB5'}},views:[{state:'frozen',xSplit:2,ySplit:4}]});
    title(w,1,c.name+' — Sipariş Listesi',14);sub(w);
    const its=S.orders[c.id]||[],rows=its.map(it=>{const m=valArr(it);return [it.name,it.code,...m,sum(m)]});
    if(rows.length){const t=z().map((_,i)=>sum(its.map(it=>valArr(it)[i]||0)));rows.push(['TOPLAM','',...t,sum(t)])}
    tbl(w,4,['İlaç','Malzeme Kodu',...ms,'Toplam'],rows,{txt:2,tot:i=>i===rows.length-1});
    if(!rows.length)w.getCell(5,1).value='Bu müşteri için sipariş verisi yok.';
    w.getColumn(1).width=42;w.getColumn(2).width=16;for(let i=3;i<=N+2;i++)w.getColumn(i).width=11;w.getColumn(N+3).width=14;
  });
  {const fdx=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?m[3]+'.'+m[2]+'.'+m[1]:''};
  const dws=wb.addWorksheet('Parti-Fiili Detay',{properties:{tabColor:{argb:'FFB3261E'}},views:[{state:'frozen',ySplit:4}]});
  const dt=dws.getCell(1,1);dt.value='Aylık Parti / Fiili Giriş Detayı';dt.font={bold:true,size:14,color:{argb:'FF12355B'}};
  const dh=['Müşteri','Ay','Ürün','Malzeme Kodu','Seri','Fiili Miktar','Tutar TL','Parti No','Teslimat Tarihi','Açıklama'];
  const hr=dws.getRow(4);hr.height=28;dh.forEach((v,i)=>{const c=hr.getCell(i+1);c.value=v;c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF12355B'}};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=bd});
  let rr=5,tq=0,tt=0;
  S.customers.forEach(c=>serDetail(c.id).forEach(x=>{
    const vals=[c.name,x.ay,x.name,x.code,x.seri,x.q,x.t,x.p,fdx(x.d),x.n];const row=dws.getRow(rr++);
    vals.forEach((v,i)=>{const cell=row.getCell(i+1);cell.value=v;cell.border=bd;cell.alignment={vertical:'middle',wrapText:true,horizontal:i===5||i===6?'right':'left'};if(i===5)cell.numFmt='#,##0.##';if(i===6)cell.numFmt='#,##0.00'});
    tq+=x.q;tt+=x.t}));
  const tr=dws.getRow(rr);['TOPLAM','','','','',tq,tt,'','',''].forEach((v,i)=>{const cell=tr.getCell(i+1);cell.value=v;cell.font={bold:true};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDCE6F1'}};cell.border=bd;if(i===5)cell.numFmt='#,##0.##';if(i===6)cell.numFmt='#,##0.00'});
  [30,14,40,16,8,14,16,16,16,50].forEach((w,i)=>dws.getColumn(i+1).width=w);}
  const buf=await wb.xlsx.writeBuffer();
  dl(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),'siparis_rapor_'+new Date().toISOString().slice(0,10)+'.xlsx');}
